name: Build APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - uses: android-actions/setup-android@v3

      - uses: gradle/actions/setup-gradle@v4

      - name: Build release APK (debug-signed, installable)
        run: ./gradlew --no-daemon assembleRelease

      - name: Rename APK
        run: cp app/build/outputs/apk/release/app-release.apk PillGuard-${{ github.run_number }}.apk

      - uses: actions/upload-artifact@v4
        with:
          name: PillGuard-apk
          path: PillGuard-${{ github.run_number }}.apk

      - name: Publish as GitHub release (direct download link)
        if: github.ref == 'refs/heads/main'
        uses: softprops/action-gh-release@v2
        with:
          tag_name: build-${{ github.run_number }}
          name: PillGuard build ${{ github.run_number }}
          files: PillGuard-${{ github.run_number }}.apk
